<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="offset" values="1;1.4;1" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#2563EB"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 0.5 0.5;360 0.5 0.5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="roundedCanvas">
      <rect x="0" y="0" width="1180" height="610" rx="26"/>
    </clipPath>
    <clipPath id="leftPanelClip">
      <rect x="30" y="30" width="418" height="550" rx="20"/>
    </clipPath>
    <clipPath id="rightPanelClip">
      <rect x="470" y="30" width="680" height="550" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedCanvas)">
    <rect width="1180" height="610" fill="url(#bgGrad)"/>

    <!-- floating background glows -->
    <circle cx="150" cy="120" r="180" fill="url(#glow1)" filter="url(#softBlur)">
      <animate attributeName="cx" values="150;220;150" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="480" r="220" fill="url(#glow2)" filter="url(#softBlur)">
      <animate attributeName="cy" values="480;400;480" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="100" r="140" fill="url(#glow1)" filter="url(#softBlur)" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- subtle scanline -->
    <rect x="0" y="0" width="1180" height="3" fill="#06B6D4" opacity="0.06">
      <animate attributeName="y" values="0;610;0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- particles -->
    <g fill="#06B6D4" opacity="0.5">
      <circle cx="120" cy="500" r="2"><animate attributeName="cy" values="500;60;500" dur="14s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="560" r="1.6"><animate attributeName="cy" values="560;40;560" dur="17s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="580" r="2"><animate attributeName="cy" values="580;20;580" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="540" r="1.4"><animate attributeName="cy" values="540;80;540" dur="16s" repeatCount="indefinite"/></circle>
    </g>

    <!-- LEFT PANEL: ASCII portrait -->
    <rect x="30" y="30" width="418" height="550" rx="20" fill="url(#panelGrad)" stroke="rgba(15,23,42,0.08)" stroke-width="1.2"/>
    <rect x="30" y="30" width="418" height="550" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="1.4" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>

    <g clip-path="url(#leftPanelClip)">
      <!-- faint circuit-dot background pattern -->
      <g fill="#64748B" opacity="0.12">
        <circle cx="80" cy="80" r="1.4"/><circle cx="130" cy="80" r="1.4"/><circle cx="180" cy="80" r="1.4"/>
        <circle cx="80" cy="120" r="1.4"/><circle cx="360" cy="90" r="1.4"/><circle cx="400" cy="130" r="1.4"/>
        <circle cx="90" cy="480" r="1.4"/><circle cx="140" cy="500" r="1.4"/><circle cx="370" cy="480" r="1.4"/>
        <circle cx="410" cy="450" r="1.4"/><circle cx="70" cy="440" r="1.4"/><circle cx="390" cy="200" r="1.4"/>
      </g>

      <!-- monogram -->
      <g text-anchor="middle">
        <text x="239" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="4" fill="url(#accentGrad)" opacity="0.95">
          NPF
          <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
        </text>
        <line x1="105" y1="192" x2="373" y2="192" stroke="url(#accentGrad)" stroke-width="1.4" opacity="0.5"/>
        <text x="239" y="215" font-family="Consolas, Menlo, monospace" font-size="10.5" letter-spacing="2" fill="#64748B">
          SOFTWARE · ML / NLP · CV
        </text>
      </g>

      <!-- orbit hub -->
      <g>
        <circle cx="239" cy="345" r="96" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-dasharray="4 7" opacity="0.35">
          <animate attributeName="stroke-dashoffset" values="0;-110" dur="12s" repeatCount="indefinite"/>
        </circle>
        <circle cx="239" cy="345" r="7" fill="url(#accentGrad)">
          <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="239" cy="345" r="14" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4">
          <animate attributeName="r" values="12;20;12" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
        </circle>

        <!-- connecting lines -->
        <line x1="239" y1="345" x2="239" y2="262" stroke="#06B6D4" stroke-width="1" opacity="0.4">
          <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3.4s" repeatCount="indefinite"/>
        </line>
        <line x1="239" y1="345" x2="322" y2="345" stroke="#06B6D4" stroke-width="1" opacity="0.4">
          <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3.8s" repeatCount="indefinite"/>
        </line>
        <line x1="239" y1="345" x2="239" y2="428" stroke="#06B6D4" stroke-width="1" opacity="0.4">
          <animate attributeName="opacity" values="0.15;0.55;0.15" dur="4.2s" repeatCount="indefinite"/>
        </line>
        <line x1="239" y1="345" x2="156" y2="345" stroke="#06B6D4" stroke-width="1" opacity="0.4">
          <animate attributeName="opacity" values="0.15;0.55;0.15" dur="3.6s" repeatCount="indefinite"/>
        </line>

        <!-- nodes -->
        <g font-family="Consolas, Menlo, monospace" font-size="11.5" text-anchor="middle">
          <g>
            <rect x="202" y="240" width="74" height="26" rx="13" fill="rgba(37,99,235,0.16)" stroke="#2563EB" stroke-width="1"/>
            <text x="239" y="257" fill="#0F172A">ML</text>
          </g>
          <g>
            <rect x="322" y="332" width="80" height="26" rx="13" fill="rgba(6,182,212,0.14)" stroke="#06B6D4" stroke-width="1"/>
            <text x="362" y="349" fill="#0F172A">NLP</text>
          </g>
          <g>
            <rect x="202" y="418" width="74" height="26" rx="13" fill="rgba(16,185,129,0.16)" stroke="#10B981" stroke-width="1"/>
            <text x="239" y="435" fill="#0F172A">CV</text>
          </g>
          <g>
            <rect x="76" y="332" width="80" height="26" rx="13" fill="rgba(37,99,235,0.16)" stroke="#2563EB" stroke-width="1"/>
            <text x="116" y="349" fill="#0F172A">RL</text>
          </g>
        </g>
      </g>

      <!-- terminal-style reveal lines below ASCII portrait -->
      <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#64748B">
        <text x="60" y="505" opacity="0">$ whoami<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="6s" begin="0.5s" fill="freeze"/></text>
        <text x="60" y="525" fill="#0F172A" opacity="0">nora.penaloza-friqui<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.65;0.7;1" dur="6s" begin="0.5s" fill="freeze"/></text>
        <text x="60" y="545" opacity="0">$ cat role.txt<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.8;1" dur="6s" begin="0.5s" fill="freeze"/></text>
        <text x="60" y="565" fill="#0F172A" opacity="0">Software &amp; ML Engineer<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.85;0.9;1" dur="6s" begin="0.5s" fill="freeze"/></text>
      </g>

      <!-- blinking cursor -->
      <rect x="232" y="555" width="8" height="14" fill="#06B6D4">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <!-- glass reflection sweep -->
      <rect x="30" y="30" width="418" height="550" fill="#0F172A" opacity="0.02">
        <animate attributeName="x" values="-450;450" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- RIGHT PANEL: terminal window -->
    <rect x="470" y="30" width="680" height="550" rx="20" fill="url(#panelGrad)" stroke="rgba(15,23,42,0.08)" stroke-width="1.2"/>
    <rect x="470" y="30" width="680" height="550" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="1.4" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- window dots -->
    <circle cx="500" cy="58" r="6" fill="#f87171"/>
    <circle cx="522" cy="58" r="6" fill="#fbbf24"/>
    <circle cx="544" cy="58" r="6" fill="#34d399"/>
    <text x="1090" y="63" font-family="Consolas, Menlo, monospace" font-size="11" fill="#475569" text-anchor="end">nora@portfolio: ~</text>

    <g clip-path="url(#rightPanelClip)">
      <text x="500" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#0F172A">Hi 👋</text>
      <text x="500" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F172A">
        I'm Nora Peñaloza Friqui
      </text>

      <!-- typing rotating role -->
      <text x="500" y="182" font-family="Consolas, Menlo, monospace" font-size="18" fill="url(#accentGrad)">
        <tspan>Software Engineer</tspan>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.22;0.25;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="182" font-family="Consolas, Menlo, monospace" font-size="18" fill="url(#accentGrad)" opacity="0">
        <tspan>Applied ML / NLP Engineer</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.22;0.25;0.47;0.5;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="182" font-family="Consolas, Menlo, monospace" font-size="18" fill="url(#accentGrad)" opacity="0">
        <tspan>Computer Vision Builder</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.47;0.5;0.72;0.75;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="182" font-family="Consolas, Menlo, monospace" font-size="18" fill="url(#accentGrad)" opacity="0">
        <tspan>Open to Opportunities</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.75;0.97;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <rect x="800" y="167" width="9" height="18" fill="#06B6D4">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>

      <!-- info lines -->
      <g font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#64748B">
        <text x="500" y="222" fill="#334155">📍</text>
        <text x="524" y="222">Seville, Spain</text>
        <text x="500" y="246" fill="#334155">🎓</text>
        <text x="524" y="246">B.Sc. Computer Engineering — Universidad de Sevilla</text>
        <text x="500" y="270" fill="#334155">🔭</text>
        <text x="524" y="270">Open to junior Software / ML opportunities</text>
        <text x="500" y="294" fill="#334155">✉️</text>
        <text x="524" y="294">npenfriq23@gmail.com</text>
      </g>

      <!-- skill pills -->
      <text x="500" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">Skills</text>
      <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#0F172A">
        <g>
          <rect x="500" y="346" width="72" height="28" rx="14" fill="rgba(37,99,235,0.18)" stroke="#2563EB" stroke-width="1"/>
          <text x="536" y="365" text-anchor="middle">Python</text>
        </g>
        <g>
          <rect x="582" y="346" width="60" height="28" rx="14" fill="rgba(37,99,235,0.18)" stroke="#2563EB" stroke-width="1"/>
          <text x="612" y="365" text-anchor="middle">Java</text>
        </g>
        <g>
          <rect x="652" y="346" width="90" height="28" rx="14" fill="rgba(6,182,212,0.16)" stroke="#06B6D4" stroke-width="1"/>
          <text x="697" y="365" text-anchor="middle">TypeScript</text>
        </g>
        <g>
          <rect x="752" y="346" width="76" height="28" rx="14" fill="rgba(6,182,212,0.16)" stroke="#06B6D4" stroke-width="1"/>
          <text x="790" y="365" text-anchor="middle">Angular</text>
        </g>
        <g>
          <rect x="838" y="346" width="98" height="28" rx="14" fill="rgba(16,185,129,0.16)" stroke="#10B981" stroke-width="1"/>
          <text x="887" y="365" text-anchor="middle">PyTorch</text>
        </g>
        <g>
          <rect x="946" y="346" width="118" height="28" rx="14" fill="rgba(16,185,129,0.16)" stroke="#10B981" stroke-width="1"/>
          <text x="1005" y="365" text-anchor="middle">Spring Boot</text>
        </g>
        <g>
          <rect x="500" y="384" width="120" height="28" rx="14" fill="rgba(37,99,235,0.18)" stroke="#2563EB" stroke-width="1"/>
          <text x="560" y="403" text-anchor="middle">HuggingFace</text>
        </g>
        <g>
          <rect x="630" y="384" width="76" height="28" rx="14" fill="rgba(6,182,212,0.16)" stroke="#06B6D4" stroke-width="1"/>
          <text x="668" y="403" text-anchor="middle">YOLOv8</text>
        </g>
        <g>
          <rect x="716" y="384" width="66" height="28" rx="14" fill="rgba(16,185,129,0.16)" stroke="#10B981" stroke-width="1"/>
          <text x="749" y="403" text-anchor="middle">Docker</text>
        </g>
        <g>
          <rect x="792" y="384" width="98" height="28" rx="14" fill="rgba(37,99,235,0.18)" stroke="#2563EB" stroke-width="1"/>
          <text x="841" y="403" text-anchor="middle">LangChain</text>
        </g>
        <g>
          <rect x="900" y="384" width="52" height="28" rx="14" fill="rgba(6,182,212,0.16)" stroke="#06B6D4" stroke-width="1"/>
          <text x="926" y="403" text-anchor="middle">SQL</text>
        </g>
        <g>
          <rect x="962" y="384" width="50" height="28" rx="14" fill="rgba(16,185,129,0.16)" stroke="#10B981" stroke-width="1"/>
          <text x="987" y="403" text-anchor="middle">Git</text>
        </g>
      </g>

      <!-- social icons row -->
      <line x1="500" y1="440" x2="1120" y2="440" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>
      <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0F172A">
        <circle cx="516" cy="472" r="20" fill="rgba(37,99,235,0.15)" stroke="#2563EB" stroke-width="1.2">
          <animate attributeName="r" values="20;22;20" dur="3s" repeatCount="indefinite"/>
        </circle>
        <text x="516" y="477" text-anchor="middle" font-size="11">GitHub</text>

        <circle cx="616" cy="472" r="20" fill="rgba(6,182,212,0.15)" stroke="#06B6D4" stroke-width="1.2">
          <animate attributeName="r" values="20;22;20" dur="3.4s" repeatCount="indefinite"/>
        </circle>
        <text x="616" y="477" text-anchor="middle" font-size="10">LinkedIn</text>

        <circle cx="716" cy="472" r="20" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1.2">
          <animate attributeName="r" values="20;22;20" dur="3.8s" repeatCount="indefinite"/>
        </circle>
        <text x="716" y="477" text-anchor="middle" font-size="10">Email</text>

        <circle cx="816" cy="472" r="20" fill="rgba(37,99,235,0.15)" stroke="#2563EB" stroke-width="1.2">
          <animate attributeName="r" values="20;22;20" dur="4.2s" repeatCount="indefinite"/>
        </circle>
        <text x="816" y="477" text-anchor="middle" font-size="9">Portfolio</text>
      </g>

      <!-- glass reflection sweep -->
      <rect x="470" y="30" width="680" height="550" fill="#0F172A" opacity="0.015">
        <animate attributeName="x" values="-680;680" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- outer border shimmer -->
    <rect x="2" y="2" width="1176" height="606" rx="24" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
